name: Tests

on:
  push:
    branches: [main, nextgen]
  pull_request:
    branches: [main, nextgen]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: 1.0.x-dev

defaults:
  run:
    working-directory: translator-neon

jobs:
  quality:
    name: PHPStan 8 and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: translator-neon
      - uses: actions/checkout@v4
        with:
          repository: bckp/translator-core
          ref: nextgen
          path: translator-core
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer phpstan -- --no-progress
      - run: composer phpcs
      - run: composer audit --no-interaction

  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          path: translator-neon
      - uses: actions/checkout@v4
        with:
          repository: bckp/translator-core
          ref: nextgen
          path: translator-core
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer tests

  psalm:
    name: Psalm (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: translator-neon
      - uses: actions/checkout@v4
        with:
          repository: bckp/translator-core
          ref: nextgen
          path: translator-core
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer psalm -- --no-progress
        continue-on-error: true
